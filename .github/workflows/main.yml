name: Build MinimalMc for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build MinimalMc for macOS (Intel)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build macOS DMG
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MinimalMc-macOS-Intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
